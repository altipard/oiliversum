[project]
name = "ingest"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "daltiparmak", email = "162328886+daltiparmak@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "supabase",
    "openpyxl",
    "pyyaml",
    "feedparser",
    "python-dotenv",
    "numpy",
    "pandas",
]

[project.optional-dependencies]
llm = ["anthropic"]

[project.scripts]
ingest = "ingest:main"

[tool.uv]
dev-dependencies = [
    "pytest",
    "respx",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"
